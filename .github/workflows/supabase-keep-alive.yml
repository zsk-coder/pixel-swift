name: Supabase Keep Alive

on:
  schedule:
    # 每 3 天的凌晨 0 点运行一次 (UTC 时间，对应北京时间早上 8 点)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 允许在 GitHub Action 页面手动点击按钮测试运行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
